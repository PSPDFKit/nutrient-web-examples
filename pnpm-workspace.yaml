packages:
  - "."

# pnpm 11 defaults verify-deps-before-run to "install", which would run a
# networked install from `pnpm run` (the pre-commit hook included) whenever
# node_modules is out of date. Warn instead so scripts never mutate the tree.
verifyDepsBeforeRun: warn

allowBuilds:
  "@biomejs/biome": true

onlyBuiltDependencies:
  - "@biomejs/biome"

overrides:
  "ajv": "^8.18.0"
  "http-proxy-middleware": "^2.0.10"
  "on-headers": "^1.1.0"
  "node-forge": "^1.4.0"
  "qs": "^6.15.1"
  "shell-quote": "^1.9.0"
  "fast-uri": "^3.1.4"
  "picomatch": "^2.3.2"
  "path-to-regexp": "^0.1.13"
  "ws": "^8.21.0"
  "websocket-driver": "^0.7.5"
  "uuid": "^11.1.1"

minimumReleaseAgeExclude:
  - follow-redirects@1.15.12
  - launch-editor@2.14.1
  - webpack-dev-server@5.2.6
  - body-parser@1.20.6
  - fast-uri@3.1.5 || 3.1.6
  - qs@6.15.4 || 6.16.0
