<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!--
      Content Security Policy for the viewer. It allows the app's own files,
      the WebAssembly engine ('wasm-unsafe-eval'), the workers, images and
      fonts the viewer creates at runtime (blob: and data: URLs), and the
      viewer's usage metrics endpoint.
      https://www.electronjs.org/docs/latest/tutorial/security#7-define-a-content-security-policy
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self' data: blob: https://dam.our.services.nutrient-powered.io"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Nutrient Electron SDK Example App</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #f6f7fa;
      }

      header {
        display: none;
      }

      #root {
        width: 100vw;
        height: 100vh;
      }

      /**
     * Offset the frame less window alternative on macOS.
     * https://electronjs.org/docs/api/frameless-window#alternatives-on-macos
     */

      body.platform-darwin header {
        -webkit-app-region: drag;
        display: block;
        height: 22px;
        background-color: rgb(252, 253, 254);
      }

      body.platform-darwin #root {
        height: calc(100vh - 22px);
      }
    </style>
  </head>

  <body>
    <header></header>
    <div id="root"></div>

    <script src="./renderer.js"></script>
  </body>
</html>
